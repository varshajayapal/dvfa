# The name of our workflow
name: Build
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      riskThreshold:
        description: "Risk Threshold"
        required: false
        default: CRITICAL

permissions:
  contents: write
  pull-requests: write

env:
  RISK_THRESHOLD: CRITICAL
  APPKNOX_ACCESS_TOKEN: 12113443ec9b5c141adc459f9afec11830d709d4
  APPKNOX_API_HOST: https://autofix.staging.appknox.io/
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set risk threshold for push
        if: github.event_name != 'workflow_dispatch'
        run: |
          echo "RISK_THRESHOLD=${{ env.RISK_THRESHOLD }}" >> $GITHUB_ENV
      - name: Set risk threshold for workflow_dispatch
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "RISK_THRESHOLD=${{ github.event.inputs.riskThreshold }}" >> $GITHUB_ENV
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Pinned: Flutter 3.50+ requires Gradle 9.3.1 / AGP 9.1.1 / KGP 2.4.10,
          # but this project uses Gradle 8.14 / AGP 8.11.1 / KGP 2.2.20.
          flutter-version: 3.41.9
          cache: true
      - name: Install Dart packages
        run: flutter pub get
      - name: Build the app bundle
        run: flutter build appbundle --release
      - name: List built bundles
        run: find build/app/outputs -name "*.aab"
      - uses: actions/upload-artifact@v4
        with:
          name: dvfa.aab
          path: build/app/outputs/bundle/release/app-release.aab
      - name: Check Appknox access token
        run: |
          if [ -z "${APPKNOX_ACCESS_TOKEN}" ]; then
            echo "::error::APPKNOX_ACCESS_TOKEN is empty. Add it under Settings > Secrets and variables > Actions > Repository secrets."
            exit 1
          fi
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Checkout appknox-go
        uses: actions/checkout@v4
        with:
          repository: appknox/appknox-go
          ref: feature/knoxfixer
          path: appknox-go
      - name: Build appknox CLI
        working-directory: appknox-go
        run: |
          mkdir -p "$GITHUB_WORKSPACE/bin"
          go build -o "$GITHUB_WORKSPACE/bin/appknox" .
      - name: Upload app and run Appknox cicheck
        id: appknox_scan
        continue-on-error: true
        run: |
          # The CLI prints some errors to stdout, so show the captured output on failure.
          if ! OUTPUT=$(./bin/appknox upload build/app/outputs/bundle/release/app-release.aab --knoxiq); then
            echo "$OUTPUT"
            echo "::error::appknox upload failed"
            exit 1
          fi
          FILE_ID=$(printf '%s' "$OUTPUT" | tail -n 1 | tr -d '[:space:]')
          if ! [[ "$FILE_ID" =~ ^[0-9]+$ ]]; then
            echo "$OUTPUT"
            echo "::error::appknox upload did not return a numeric file ID"
            exit 1
          fi
          echo "Uploaded file id: $FILE_ID"
          echo "file_id=$FILE_ID" >> "$GITHUB_OUTPUT"
          ./bin/appknox cicheck "$FILE_ID" --risk-threshold "${RISK_THRESHOLD}"
      - name: Run Appknox autofix
        if: steps.appknox_scan.outputs.file_id != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          APPKNOX=./bin/appknox
          FILE_ID="${{ steps.appknox_scan.outputs.file_id }}"
          $APPKNOX autofix --file-id "$FILE_ID"
      - name: Fail if cicheck found issues
        if: steps.appknox_scan.outcome == 'failure'
        run: exit 1
